<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открыть в Karing</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
font-family:system-ui,-apple-system,sans-serif;background:#0f1115;color:#e8eaed}
.c{max-width:440px;padding:24px}a{color:#8ab4f8}p{color:#9aa0a6;font-size:14px}
.b{display:block;margin:14px 0;padding:15px;border-radius:12px;background:#3b82f6;color:#fff;
font-weight:600;text-decoration:none}.g{background:#2a2f3a}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #333;border-radius:8px;
background:#181b21;color:#e8eaed}
</style></head><body><div class="c">
<h2>Добавляем подписку в Karing</h2>
<p id="os"></p>
<a class="b" id="open" href="#">Открыть Karing</a>
<a class="b g" id="get" href="#">Скачать Karing</a>
<p id="alt"></p>
<p>Если ничего не произошло — откройте эту страницу в Safari или Chrome
(меню ⋯ → «Открыть в браузере») или добавьте подписку в Karing вручную по ссылке
(нажмите на неё — она скопируется):</p>
<input id="link" readonly onclick="this.select();navigator.clipboard&&navigator.clipboard.writeText(this.value)">
</div>
<script>
// Одно устройство — одна кнопка: ОС определяется здесь, на GitHub Pages.
var p = new URLSearchParams(location.hash.slice(1));
var url = p.get("url") || "", name = p.get("name") || "VPN";
var ua = navigator.userAgent || "";
var os = /android/i.test(ua) ? "android"
       : /iphone|ipad|ipod/i.test(ua) ? "ios"
       : /macintosh|mac os x/i.test(ua) ? "macos"
       : /windows/i.test(ua) ? "windows" : "linux";
var names = { ios: "iPhone / iPad", android: "Android", macos: "macOS", windows: "Windows", linux: "Linux" };
document.getElementById("os").textContent = "Устройство: " + names[os];
var q = "url=" + encodeURIComponent(url) + "&name=" + encodeURIComponent(name);
var store = os == "ios" ? "https://apps.apple.com/us/app/karing/id6472431552"
                        : "https://github.com/KaringX/karing/releases/latest";
var link = "karing://install-config?" + q;
document.getElementById("link").value = url;
if (os == "android") {                          // Chrome: если Karing нет — сам откроет store
  var a = document.createElement("a");
  a.href = link; a.textContent = "Другой способ открыть";
  document.getElementById("alt").appendChild(a);
  link = "intent://install-config?" + q + "#Intent;scheme=karing;package=com.nebula.karing;" +
         "S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
}
document.getElementById("open").href = link;
document.getElementById("get").href = store;
var left = false;
function away() { left = true; }
document.addEventListener("visibilitychange", function () { if (document.hidden) away(); });
window.addEventListener("pagehide", away);
window.addEventListener("blur", away);
if (url) {
  location.href = link;                         // сразу открываем Karing
  if (os == "ios")                              // не открылся — значит, его нет: в App Store
    setTimeout(function () { if (!left) location.href = store; }, 3500);
}
</script></body></html>
